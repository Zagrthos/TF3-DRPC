# Builds and tests the companion app on Windows and macOS for every pull request and every push
# to main that changes what the build reads. A push to main also builds the release zips with
# tools/build-release.ps1, so each merge leaves downloadable zips (14 days) and AOT problems show
# before a release.
name: CI

# Only the paths the build, the tests and the zips read: a change to the docs, the mod or the
# test-run scripts needs no build, and a run takes a runner for about 6 minutes on Windows and 3
# on macOS. Run it by hand with workflow_dispatch.
#
# The "CI on main" ruleset requires the Windows and macOS checks, and a workflow that a path filter
# never starts leaves them pending forever. So every pull request starts the jobs, and the first
# step skips the rest when the pull request changes none of these paths (keep both lists in sync).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'docs/log-samples/**'
      - 'assets/discord/cover.png'
      - 'tools/build-release.ps1'
      - 'tools/new-third-party-notices.ps1'
      - 'tools/licences/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            workload: maui-windows
          # The .NET 11 Mac Catalyst SDK needs Xcode 27.2, which only the xcode-27 image has (a preview image).
          - name: macOS
            os: xcode-27
            workload: maui-maccatalyst
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: companion
    steps:
      # .editorconfig wants CRLF; without this, macOS checks out LF and the analysers warn on every line.
      - name: Check out with CRLF line endings
        working-directory: .
        run: git config --global core.autocrlf true

      # A pull request checks out its merge commit; two commits deep, HEAD^1 is the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # Same paths as push.paths above. --no-renames lists both names of a moved file.
      - name: Check whether the build reads a changed file
        id: changes
        working-directory: .
        shell: bash
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            build=false
            while IFS= read -r file; do
              case "$file" in
                companion/*|docs/log-samples/*|assets/discord/cover.png|tools/build-release.ps1|\
                tools/new-third-party-notices.ps1|tools/licences/*|LICENSE|.editorconfig|\
                .gitattributes|.github/workflows/ci.yml)
                  build=true ;;
              esac
            done < <(git diff --name-only --no-renames HEAD^1 HEAD)
          fi
          [ "$build" = true ] || echo "::notice::No file the build reads changed; skipping the build and tests."
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 27.2
        if: runner.os == 'macOS' && steps.changes.outputs.build == 'true'
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.changes.outputs.build == 'true'
        with:
          global-json-file: companion/global.json

      # Run in companion/, so the workload set pinned in global.json is the one installed.
      - name: Install the MAUI workload
        if: steps.changes.outputs.build == 'true'
        run: dotnet workload install ${{ matrix.workload }}

      - name: Build Debug
        if: steps.changes.outputs.build == 'true'
        run: dotnet build TF3-DRPC.slnx -c Debug

      - name: Build Release
        if: steps.changes.outputs.build == 'true'
        run: dotnet build TF3-DRPC.slnx -c Release

      - name: Test
        if: steps.changes.outputs.build == 'true'
        run: dotnet test TF3-DRPC.slnx

      - name: Build the release zip
        if: github.event_name == 'push'
        working-directory: .
        run: ./tools/build-release.ps1 -SkipTests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: TF3-DRPC-${{ matrix.name }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
