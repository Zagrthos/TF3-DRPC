# CodeQL for the companion app. The app builds for Windows on Windows and for Mac Catalyst on
# macOS, and each build compiles only its own Platforms/ folder, so both are analysed, each under
# its own category. Setup follows ci.yml; the tests project is not built.
#
# Windows traces a real build. macOS cannot: the CodeQL tracer injects libtrace.dylib into every
# process, it has no arm64e slice, and dyld kills Apple's arm64e tools (actool, xcode-select) on
# start. So macOS uses buildless extraction, which reads every .cs file in the repository, and
# keeps only the findings in Platforms/MacCatalyst/; the Windows build covers the shared code.
name: CodeQL C#

on:
  pull_request:
    paths: &paths
      - 'companion/**'
      - '.github/workflows/codeql-csharp.yml'
      - '.github/codeql/**'
  push:
    branches: [main]
    paths: *paths
  schedule:
    # Daily at 05:00 UTC, so new queries also cover code that has not changed.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-csharp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyze (csharp, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            workload: maui-windows
            build-mode: manual
            # Drop findings in generated code (XAML, resources, source generators).
            sarif-filter: |
              -**/obj/**
              -**/*.g.cs
              -**/*.g.i.cs
              -**/*.Designer.cs
          # The .NET 11 Mac Catalyst SDK needs Xcode 27.2, which only the xcode-27 image has (a preview image).
          # The workload and the restore give buildless extraction the Mac Catalyst references.
          - name: macOS
            os: xcode-27
            workload: maui-maccatalyst
            build-mode: none
            sarif-filter: |
              -**/*
              +companion/Tf3Drpc.App/Platforms/MacCatalyst/**/*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: pwsh
        working-directory: companion
    steps:
      # .editorconfig wants CRLF; without this, macOS checks out LF and the analysers warn on every line.
      - name: Check out with CRLF line endings
        working-directory: .
        run: git config --global core.autocrlf true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.2
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: companion/global.json

      # Run in companion/, so the workload set pinned in global.json is the one installed.
      - name: Install the MAUI workload
        run: dotnet workload install ${{ matrix.workload }}

      - name: Restore
        run: dotnet restore Tf3Drpc.App/Tf3Drpc.App.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: csharp
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build Tf3Drpc.App/Tf3Drpc.App.csproj -c Release --no-restore --no-incremental

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:csharp/os:${{ matrix.name }}
          output: sarif-results
          upload: failure-only

      - name: Filter SARIF results
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: ${{ matrix.sarif-filter }}
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: sarif-results/csharp.sarif
          category: /language:csharp/os:${{ matrix.name }}
