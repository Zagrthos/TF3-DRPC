# CodeQL for the GitHub Actions workflows. The other languages have their own codeql-*.yml, so
# each runs only when its files change.
name: CodeQL Actions

on:
  pull_request:
    paths: &paths
      - '.github/workflows/**'
      - '.github/codeql/**'
  push:
    branches: [main]
    paths: *paths
  schedule:
    # Daily at 04:00 UTC, so new queries also cover code that has not changed.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-actions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:actions
