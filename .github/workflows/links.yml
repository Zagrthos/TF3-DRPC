# Checks the external links of the Markdown documentation once a week with lychee. Links inside the
# repository are checked on every pull request by the Docs workflow (tools/docs/Test-Docs.ps1); this one
# only reaches the network, so a site that is down for a while fails this run and no pull request.
# Code reviews (reviews/<area>/<date>/) are records and keep their links as written.
name: Links

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token raises GitHub's rate limit for the many github.com links.
      - name: Check the external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          fail: true
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --exclude-path reviews
            --exclude-path .claude
            './**/*.md'
